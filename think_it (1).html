    <style>
        body {
            background-color: #020617;
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y; /* Prevent pinch zoom but allow scrolling if needed */
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);

            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6d28d9, #be185d);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(236, 72, 153, 0.4);
        }

        /* Wheel Styles */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            overflow: hidden;
            border: 4px solid white;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1);
            position: relative;
        }
        .wheel-slice {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }
        .wheel-text {
            position: absolute;
            transform: rotate(45deg) translateY(-40px); /* Adjust based on slice logic */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
        }
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #f59e0b;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
            z-index: 1000;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Drawing Canvas */
        #draw-canvas {
            touch-action: none; /* Crucial for drawing on mobile */
            background-color: white;
            border-radius: 0.5rem;
            cursor: crosshair;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Custom Scrollbar for scoreboard */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #6d28d9; border-radius: 3px; }
    </style>
</head>

    // --- Audio System (Synthesizer) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (!state.settings.sound) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        switch(type) {
            case 'click':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
                break;
            case 'spin':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
                break;
            case 'correct':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                break;
            case 'wrong':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
                break;
            case 'tick':
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
                break;
            case 'win':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);

                gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
                break;
        }
    }

            render();

    async function getAIContent(gameId, difficulty) {
        if (!state.settings.aiEnabled) return null;
        
        const apiKey = ""; // Gemini API requires this empty in canvas
        if(apiKey === undefined) return null;

        const prompts = {
            g1: `Generate a short, fun riddle in ${state.lang === 'ar' ? 'Egyptian Arabic (العامية المصرية)' : 'English'} for a party game. Difficulty: ${difficulty}. Return ONLY valid JSON format: {"q": "the riddle question", "a": "short answer"}. Do not use markdown tags.`,

        };

        const prompt = prompts[gameId];
        if(!prompt) return null; // Fallback for games that don't strictly need AI (like reaction or random memory)

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.8 }
                })
            });
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            // Clean up potential markdown formatting from AI response
            const cleanedText = text.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(cleanedText);
        } catch (e) {
            console.error("AI Error:", e);
            return null; // Trigger fallback
        }
    }

        state.selectedGame = gameId;
        changeView('wheel'); // Spin to select player

    async function launchSelectedGame() {
        changeView('loading');
        
        // Fetch AI content or use fallback
        let content = await getAIContent(state.selectedGame, state.difficulty);
        
        if (!content) {
            // Fallback logic
            const fbg = fallbackGames[state.selectedGame]?.[state.lang]?.[state.difficulty];
            if (fbg) {
                content = fbg[Math.floor(Math.random() * fbg.length)];
            } else {
                // Programmatic fallbacks for other games
                if(state.selectedGame === 'g4') content = { category: state.lang==='ar'?"حيوانات":"Animals", forbiddenLetter: state.lang==='ar'?"م":"a" };
                if(state.selectedGame === 'g7') content = { identity: state.lang==='ar'?"أسد":"Lion" };
                if(state.selectedGame === 'g2') content = { }; // specific logic inside game
            }
        }
        
        state.gameData = content;
        changeView('howToPlay');
    }

    // Score calculation based on speed
    function calculateScore(timeLeft, totalTime, isCorrect) {
        if(!isCorrect) return { points: 0, text: t('wrong') };
        
        const ratio = timeLeft / totalTime;
        let points = 0;
        let text = "";
        
        const base = state.difficulty === 'easy' ? 40 : (state.difficulty === 'medium' ? 60 : 80);
        const bonusMax = state.difficulty === 'easy' ? 40 : (state.difficulty === 'medium' ? 40 : 20);

        points = Math.floor(base + (ratio * bonusMax));

        if(ratio > 0.7) text = t('pointsFast');
        else if(ratio > 0.3) text = t('pointsNormal');
        else text = t('pointsSlow');

        return { points, text: `+${points} ⭐ - ${text}` };
    }

    function finishRound(points, message) {
        if(points > 0) {
            state.players[state.currentPlayerIndex].score += points;
            playSound('correct');
        } else {
            playSound('wrong');
        }
        
        showScorePopup(message, () => {
            changeView('scoreboard');
        });
    }

        }
    }

                    ${t('spin')}
                </button>
            </div>
        `;

        const wheel = document.getElementById('roulette-wheel');
        const numSlices = state.players.length;
        const sliceAngle = 360 / numSlices;
        const colors = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444'];

        state.players.forEach((p, i) => {
            const slice = document.createElement('div');
            slice.className = 'wheel-slice';
            slice.style.backgroundColor = colors[i % colors.length];
            slice.style.transform = `rotate(${i * sliceAngle}deg)`;
            // Complex CSS to make slices look right, simplified for this env:
            // Using a hack for simple rendering: Just render text positioned around center
            slice.innerHTML = `<span class="absolute right-4 font-bold text-lg" style="transform: rotate(${sliceAngle/2}deg);">${p.name}</span>`;
            
            // Better wheel rendering approach for dynamic slices:
            slice.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, 0 100%)`; // Reset default
            // True conic gradient is better for pure CSS wheels
        });

        // Simpler, cleaner Conic Gradient Wheel approach:
        let conicStops = state.players.map((p, i) => {
            const start = i * sliceAngle;
            const end = (i + 1) * sliceAngle;
            return `${colors[i % colors.length]} ${start}deg ${end}deg`;
        }).join(', ');
        
        wheel.style.background = `conic-gradient(${conicStops})`;
        
        // Add names on top
        state.players.forEach((p, i) => {
            const angle = (i * sliceAngle) + (sliceAngle / 2);
            const text = document.createElement('div');
            text.style.position = 'absolute';
            text.style.top = '50%'; text.style.left = '50%';
            text.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-100px)`;
            text.style.fontWeight = 'bold';
            text.style.textShadow = '1px 1px 4px black';
            text.innerText = p.name;
            wheel.appendChild(text);
        });

        let isSpinning = false;
        document.getElementById('spin-btn').onclick = () => {
            if(isSpinning) return;
            isSpinning = true;
            playSound('spin'); // Rapid sound ideally, simplified here
            
            // Random spin
            const targetIndex = Math.floor(Math.random() * numSlices);
            // Calculate rotation to land on target (account for pointer at top (0 deg))
            const targetRotation = (360 * 5) - (targetIndex * sliceAngle) - (sliceAngle / 2); // 5 full spins + target
            
            wheel.style.transition = 'transform 3s cubic-bezier(0.2, 0.8, 0.2, 1)';
            wheel.style.transform = `rotate(${targetRotation}deg)`;

            let tickInterval = setInterval(() => playSound('tick'), 200);

            setTimeout(() => {
                clearInterval(tickInterval);
                playSound('correct');
                onPlayerSelected(targetIndex);
            }, 3000);
        };
    }

        };

        const stopTimerAndScore = (isCorrect) => {
            clearInterval(window.activeGameTimer);

            finishRound(res.points, res.text);
        };

        // Render Specific Game Logic
        switch(state.selectedGame) {
            case 'g1': // Think It (Riddle)

                     if(e.target.innerText === 'غلط') stopTimerAndScore(false);

                break;

                            <button onclick="arguments[0](false)" class="bg-red-500 flex-1 py-4 rounded-xl font-bold text-xl">استسلم ❌</button>

                    </div>
                `;
                area.querySelectorAll('button').forEach(b => b.onclick = () => stopTimerAndScore(b.innerText.includes('عرفوها')));
                startTimer();
                break;

            case 'g3': // Draw It
                area.innerHTML = `
                    <div class="w-full flex flex-col items-center h-full">
                        <div class="text-2xl mb-2">ارسم: <span class="font-bold text-accent">${state.gameData.q || "قطة"}</span></div>
                        <canvas id="draw-canvas" class="w-full flex-1 mb-4" width="300" height="400"></canvas>
                        <div class="flex gap-2 w-full">
                            <button id="clear-btn" class="bg-gray-700 py-3 px-4 rounded-xl font-bold">مسح</button>
                            <button onclick="arguments[0](true)" class="bg-green-500 flex-1 py-3 rounded-xl font-bold text-xl">خمّنوها! ✅</button>
                        </div>
                    </div>
                `;
                
                // Canvas Drawing Logic
                setTimeout(() => {
                    const canvas = document.getElementById('draw-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    
                    let isDrawing = false;
                    
                    const startPos = (e) => {
                        isDrawing = true;
                        draw(e);
                    };
                    const endPos = () => {
                        isDrawing = false;
                        ctx.beginPath();
                    };
                    const draw = (e) => {
                        if (!isDrawing) return;
                        e.preventDefault(); // prevent scrolling
                        
                        const rect = canvas.getBoundingClientRect();
                        let x = e.clientX || e.touches[0].clientX;
                        let y = e.clientY || e.touches[0].clientY;
                        
                        ctx.lineTo(x - rect.left, y - rect.top);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x - rect.left, y - rect.top);
                    };

                    canvas.addEventListener('mousedown', startPos);
                    canvas.addEventListener('mouseup', endPos);
                    canvas.addEventListener('mousemove', draw);
                    canvas.addEventListener('touchstart', startPos);
                    canvas.addEventListener('touchend', endPos);
                    canvas.addEventListener('touchmove', draw);
                    
                    document.getElementById('clear-btn').onclick = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    };
                }, 100);

                area.querySelector('.bg-green-500').onclick = () => stopTimerAndScore(true);
                startTimer();
                break;
                
            case 'g6': // Reaction
                clearInterval(window.activeGameTimer); // No normal timer
                document.getElementById('game-timer').style.display = 'none';
                area.innerHTML = `
                    <div id="reaction-btn" class="w-full h-64 bg-red-600 rounded-3xl flex items-center justify-center text-4xl font-bold shadow-lg transition-colors cursor-pointer select-none">
                        استنى...
                    </div>
                `;
                
                const rBtn = document.getElementById('reaction-btn');
                let startTime;
                let isGreen = false;
                let clickedTooEarly = false;
                
                const delay = Math.random() * 3000 + 2000; // 2-5 seconds
                
                const turnGreen = setTimeout(() => {
                    if(clickedTooEarly) return;
                    isGreen = true;
                    rBtn.classList.replace('bg-red-600', 'bg-green-500');
                    rBtn.innerText = "اضغط دلوقتي!!";
                    startTime = Date.now();
                }, delay);

                rBtn.onmousedown = rBtn.ontouchstart = (e) => {
                    e.preventDefault();
                    if(!isGreen) {
                        clickedTooEarly = true;
                        clearTimeout(turnGreen);
                        rBtn.innerText = "استعجلت! ❌";
                        setTimeout(() => finishRound(0, "استعجلت جداً!"), 1000);
                    } else {
                        const reactionTime = Date.now() - startTime;
                        let pts = 100;
                        if(reactionTime > 300) pts = 80;
                        if(reactionTime > 500) pts = 50;
                        if(reactionTime > 1000) pts = 20;
                        finishRound(pts, `رد فعل في ${reactionTime}ms ⚡`);
                    }
                };
                break;

            default:
                // Generic fallback for unimplemented mini-games for this demo
                area.innerHTML = `
                    <div class="glass-panel p-6 rounded-2xl w-full text-center">
                        <h2 class="text-2xl mb-8">لعبة تحت الإنشاء (Demo)</h2>
                        <button onclick="arguments[0](true)" class="btn-primary py-3 px-8 rounded-xl font-bold text-xl w-full mb-4">كسب</button>
                        <button onclick="arguments[0](false)" class="bg-gray-700 py-3 px-8 rounded-xl font-bold w-full">خسر</button>
                    </div>
                `;
                area.querySelectorAll('button').forEach(b => b.onclick = () => stopTimerAndScore(b.innerText === 'كسب'));
                startTimer();
                break;
        }
    }

    function showScorePopup(msg, callback) {
        const modal = document.getElementById('modal-container');
        modal.innerHTML = `
            <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full transform transition-all scale-105 border-2 border-primary shadow-[0_0_30px_rgba(109,40,217,0.6)]">
                <div class="text-6xl mb-4 ${msg.includes('+') ? 'animate-bounce-slight' : 'shake'}">
                    ${msg.includes('+') ? '🎉' : '😅'}
                </div>
                <h2 class="text-3xl font-black mb-6">${msg}</h2>
                <button id="modal-next-btn" class="btn-primary w-full py-4 rounded-xl font-bold text-xl">${t('next')}</button>
            </div>
        `;
        modal.classList.remove('hidden');
        
        if(msg.includes('+')) {
            createConfetti();
            playSound('win');
        }

        document.getElementById('modal-next-btn').onclick = () => {
            modal.classList.add('hidden');
            callback();
        };
    }

    function createConfetti() {
        for(let i=0; i<50; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = -10 + 'px';
            conf.style.backgroundColor = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'][Math.floor(Math.random()*5)];
            conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    function renderScoreboard(container) {
        // Sort players by score for display
        const sorted = [...state.players].sort((a,b) => b.score - a.score);
        
        container.innerHTML = `
            <div class="flex flex-col h-full w-full slide-up">
                <h2 class="text-3xl font-bold text-center mb-6">${t('score')}</h2>
                
                <div class="flex-1 overflow-y-auto space-y-3 pb-4 px-2">
                    ${sorted.map((p, i) => `
                        <div class="glass-panel p-4 rounded-2xl flex items-center justify-between relative overflow-hidden ${p.id === state.players[state.currentPlayerIndex].id ? 'border-2 border-primary shadow-[0_0_15px_rgba(109,40,217,0.4)]' : ''}">
                            <div class="flex items-center gap-4 relative z-10">
                                <span class="text-3xl">${i===0?'🥇':i===1?'🥈':i===2?'🥉':''}</span>
                                <span class="font-bold text-xl">${p.name}</span>
                            </div>
                            <span class="font-black text-2xl text-accent relative z-10">${p.score} ⭐</span>
                            ${i===0 ? `<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/20 to-transparent animate-pulse-fast opacity-50"></div>` : ''}
                        </div>
                    `).join('')}
                </div>

                <div class="mt-auto pt-4 space-y-3">
                    <button onclick="changeView('games')" class="btn-primary w-full py-4 rounded-xl font-bold text-xl">لعبة جديدة</button>
                    <button onclick="changeView('consequence')" class="glass-panel w-full py-3 rounded-xl font-bold text-gray-300 hover:text-white border border-red-500/30 hover:border-red-500 hover:bg-red-500/10 transition">نهي اللعبة والعواقب 😈</button>
                </div>
            </div>
        `;
    }

    function renderConsequence(container) {
        const sorted = [...state.players].sort((a,b) => a.score - b.score);
        const loser = sorted[0]; // Lowest score
        
        const list = consequencesList[state.lang];
        let currentConsequence = list[Math.floor(Math.random() * list.length)];

        container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full w-full slide-up text-center px-4">
                <h2 class="text-2xl text-gray-400 mb-2">${t('loser')}</h2>
                <h1 class="text-5xl font-black text-red-500 mb-8 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">${loser.name}</h1>
                
                <h3 class="text-xl mb-4">${t('consequenceWheel')}</h3>
                
                <div class="glass-panel p-8 rounded-3xl w-full border border-gray-600 mb-8 relative min-h-[150px] flex items-center justify-center">
                    <p id="cons-text" class="text-2xl font-bold leading-relaxed">${currentConsequence}</p>
                </div>
                
                <div class="flex gap-4 w-full">
                    <button id="reroll-btn" class="bg-gray-800 flex-1 py-4 rounded-xl font-bold border border-gray-600">${t('anotherConsequence')}</button>
                    <button onclick="changeView('home'); state.players.forEach(p=>p.score=0);" class="btn-primary flex-1 py-4 rounded-xl font-bold">${t('mainMenu')}</button>
                </div>
            </div>
        `;

        document.getElementById('reroll-btn').onclick = () => {
            playSound('spin');
            const el = document.getElementById('cons-text');
            el.classList.add('opacity-0');
            setTimeout(() => {
                currentConsequence = list[Math.floor(Math.random() * list.length)];
                el.innerText = currentConsequence;
                el.classList.remove('opacity-0');
                el.classList.add('fade-in');
            }, 200);
        };
    }

    // --- Init ---
    window.onload = () => {
        setLang(state.lang); // Triggers render
    };

</script>
</body>
</html>
